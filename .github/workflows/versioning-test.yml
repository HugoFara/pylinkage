# This workflow will install Python dependencies, run tests, lint and type check
# with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python versioning test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      # Without this, every `uv run` re-creates .venv with .python-version (3.11).
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "latest"
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --python ${{ matrix.python-version }}
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Type check with mypy
      run: uv run mypy src/pylinkage --ignore-missing-imports
    - name: Test with pytest and coverage
      run: uv run pytest --cov=pylinkage --cov-report=xml
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
